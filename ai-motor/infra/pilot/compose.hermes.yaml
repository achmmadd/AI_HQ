# motor-pilot — Hermes-sidecar overlay (runtime-activatie 2026-08-15, spoor A;
# voortbouwend op integratiesprint spoor B van 2026-08-14).
#
# Aparte overlay bovenop infra/pilot/compose.yaml:
#   docker compose -f compose.yaml -f compose.hermes.yaml ...
#
# De sidecar IS de Motor-Hermes-runtime (stdlib-only, geen extern package)
# en spreekt het fase-0 sidecarprotocol (zie
# pilot/evidence/integration-sprint/PHASE-0.md): HTTP/JSON, uitsluitend
# loopback/intern, geen volumes, geen secrets.
#
# Dit bestand dwingt af:
# - image gebouwd uit infra/pilot/hermes/Dockerfile: gepinde base-digest,
#   nul pip-afhankelijkheden, non-root (uid 10001) — nooit een zwevende tag;
# - read_only rootfs, cap_drop ALL, no-new-privileges;
# - GEEN volumes: het image bevat sidecar.py zelf; er is geen repo-mount,
#   geen context- of draft-mount en geen enkele duurzame staat;
# - GEEN publieke poorten en geen host-netwerkmodus: de Motor-facing kant
#   van de sidecar hangt uitsluitend aan het interne netwerk hermes-net
#   (internal: true → geen egress én geen route naar de storepoort of de
#   host-loopback van andere diensten). De Motor-API draait met
#   network_mode: host en bereikt de sidecar op diens container-IP op
#   hermes-net (de host routeert altijd naar eigen bridges, óók interne);
# - de modelendpoint komt uit de omgeving (MODEL_PORT_URL). P0.8-opent deze
#   egress op de minimaal mogelijke manier: een tweede attachment aan
#   pilot-egress, een gewone bridge ZONDER internal-flag, uitsluitend
#   gekoppeld aan deze sidecar en nergens anders. Het eiland hermes-net
#   blijft internal: true; alleen modelverkeer richting het tailnet verlaat
#   de container. De daadwerkelijke activatie (up-commando's, zonder de
#   draaiende motor-pilot-api/store te recreaten) is een aparte live-stap —
#   zie pilot/evidence/runtime-activation/P08-INTEGRATIE.md.
#
# Configuratie via de .env (gitignored) naast compose.yaml — de repo bevat
# nooit echte infrastructuurwaarden (zie infra/pilot/hermes/env.example).
# Fictieve voorbeeldwaarden:
#   HERMES_SIDECAR_PORT=4410
#   MODEL_PORT_URL=http://<RTX_TAILNET_IP>:8080/v1
#   MODEL_NAME=Qwen3.6-35B-A3B-UD-Q4_K_XL
#   MODEL_REQUEST_TIMEOUT_S=120

name: motor-pilot

services:
  hermes-sidecar:
    build:
      context: ./hermes
    image: motor-pilot-hermes-sidecar:0.2.0
    user: "10001:10001"
    networks:
      # Het interne eiland (Motor-facing) plus het dedicated egress-netwerk
      # voor het tailnet-ModelPort (P0.8) — niets anders, nooit meer.
      - hermes-net
      - pilot-egress
    # Geen volumes: stateless; het image draagt de enige code.
    environment:
      # Container-interface op het interne netwerk; nooit naar buiten gepubliceerd.
      HERMES_SIDECAR_HOST: "0.0.0.0"
      HERMES_SIDECAR_PORT: ${HERMES_SIDECAR_PORT:?zet in .env — zie hermes/env.example}
      MODEL_PORT_URL: ${MODEL_PORT_URL:?zet in .env — zie hermes/env.example}
      MODEL_NAME: ${MODEL_NAME:?zet in .env — zie hermes/env.example}
      MODEL_REQUEST_TIMEOUT_S: ${MODEL_REQUEST_TIMEOUT_S:-120}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Liveness: het protocolantwoord van /health (HTTP 200) bewijst dat het
      # proces serveert; de veldwaarde ok/degraded is het readiness-signaal.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['HERMES_SIDECAR_PORT']+'/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  # Intern eiland voor de sidecar: geen egress, geen gepubliceerde poorten.
  hermes-net:
    internal: true
  # P0.8: dedicated egress-bridge richting het tailnet-ModelPort. Bewust
  # GEEN internal-flag (dat zou egress juist blokkeren) en uitsluitend aan
  # de sidecar gekoppeld; geen poorten, geen andere diensten. Fijnmazige
  # begrensing tot alleen het ModelPort-IP blijft een operatorhandeling op
  # de host-firewall (buiten compose).
  pilot-egress:
    driver: bridge
