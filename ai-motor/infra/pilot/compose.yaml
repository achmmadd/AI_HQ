# motor-pilot — geïsoleerde shadow-pilot runtime op Hetzner (Motor2).
#
# De runner (ai-motor/pilot/run-shadow.ts) is een ONE-SHOT CLI: hij draait één
# shadow-run, print één JSON naar stdout en stopt. Er is daarom bewust GEEN
# poortmapping — de container luistert nergens op, wat de netwerkgrens van
# plan-stap 5/6 (default-deny, geen publieke poort) direct afdwingt.
# De eerder geschetste ssh -L 4400-tunnel is daarmee niet nodig; de run gaat via:
#
#   ssh hetzner 'cd /opt/motor-pilot && docker compose run --rm motor-pilot'
#
# en het bewijs (draft + evidence-JSON) komt uit stdout/docker logs.
#
# Voorwaarden: repo-checkout op de gemergede pilot-commit onder ${REPO_PATH:-./repo}
# (read-only gemount), en Tailscale op Hetzner (plan-stap 4) zodat
# MODEL_PORT_URL (het Tailscale-IP van de RTX-pc) bereikbaar is.

name: motor-pilot

services:
  motor-pilot:
    image: node:24-alpine
    # Draai als de niet-root 'node' user (uid/gid 1000 in de image).
    user: "1000:1000"
    working_dir: /app/ai-motor
    volumes:
      # Repo-checkout read-only; de pilot schrijft niets aan code.
      - ${REPO_PATH:-./repo}:/app:ro
      # Append-only conceptstore (draft.store-adapter achter de gateway).
      - pilot-data:/data
    environment:
      MODEL_PORT_URL: http://100.118.204.123:8080
      MODEL_NAME: Qwen3.6-35B-A3B-UD-Q4_K_XL
      MODEL_TIMEOUT_MS: "120000"
      # Echte input (optioneel; leeg = synthetische stand voor tests/CI):
      #   REVIEW_TEXT="★★★★☆ ..." docker compose run --rm motor-pilot
      REVIEW_TEXT: ${REVIEW_TEXT:-}
      ONDERNEMER_CONTEXT: ${ONDERNEMER_CONTEXT:-}
    # Node 24 draait .ts native (type stripping, zoals de proof-tests).
    command: ["node", "pilot/run-shadow.ts"]
    networks:
      - pilot-net
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  # Trede 1 naar "live": dezelfde draft-core als HTTP-dienst.
  # De poort bindt UITSLUITEND aan het Tailscale-IP van Hetzner —
  # er is dus geen publieke poort; het tailnet is de netwerkgrens.
  #   POST http://100.97.30.22:4400/draft  {"review": "..."}
  motor-pilot-api:
    image: node:24-alpine
    user: "1000:1000"
    working_dir: /app/ai-motor
    volumes:
      - ${REPO_PATH:-./repo}:/app:ro
      - pilot-data:/data
    environment:
      MODEL_PORT_URL: http://100.118.204.123:8080
      MODEL_NAME: Qwen3.6-35B-A3B-UD-Q4_K_XL
      MODEL_TIMEOUT_MS: "120000"
    command: ["node", "pilot/server.ts"]
    ports:
      - "100.97.30.22:4400:4400"
    networks:
      - pilot-net
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

networks:
  # Eigen docker-netwerk; geen gedeelde netwerken of volumes met bestaande
  # stacks (motor-postgres, qdrant, dify, bokas, nginx blijven no-touch).
  pilot-net:
    driver: bridge

volumes:
  # Append-only conceptstore; alleen dit volume is schrijfbaar.
  pilot-data:
