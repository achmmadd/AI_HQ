# Motor AI — unified Hetzner stack (Sprint 3.1)
#
# Core (always on): Postgres · Qdrant · Ollama (embed only)
# Optional profiles: litellm · n8n · full (= litellm + n8n)
#
# Dify is NOT inlined — 4–6 GB multi-container stack; deploy separately:
#   scripts/hetzner-phase1-from-nuc.sh → /opt/dify/docker
#
# Deploy: docs/hybrid-env.md
# RAM budget (16 GB): see MASTER-BUILD-PLAN appendix C

name: motor-hetzner

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: motor-postgres
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-motor_ai}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - motor_pg_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-motor} -d ${POSTGRES_DB:-motor_ai}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: motor-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND:-127.0.0.1}:6333:6333"
    volumes:
      - motor_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6333/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4g

  ollama:
    image: ollama/ollama:latest
    container_name: motor-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - motor_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536m

  # One-shot: pull embed model only (no chat LLM on 16 GB box)
  ollama-init:
    profiles: ["init"]
    image: ollama/ollama:latest
    container_name: motor-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && echo embed model ready",
      ]

  litellm:
    profiles: ["litellm", "full"]
    image: ghcr.io/berriai/litellm:main-stable
    container_name: motor-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_BIND:-127.0.0.1}:4000:4000"
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY for litellm profile}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY for litellm profile}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  n8n:
    profiles: ["n8n", "full"]
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: motor-n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND:-127.0.0.1}:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      GENERIC_TIMEZONE: ${TZ:-Europe/Amsterdam}
    volumes:
      - motor_n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  motor_pg_data:
  motor_qdrant_data:
  motor_ollama_data:
  motor_n8n_data:
