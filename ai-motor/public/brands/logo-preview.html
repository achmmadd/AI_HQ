<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo preview</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .panel { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
    .panel.dark { background: #0c0c0e; border-color: #2a2a36; color: #ededef; }
    .panel.light { background: #f6f7f9; }
    .logo-compact { height: 32px; width: auto; object-fit: contain; }
    .logo-regular { height: 96px; width: auto; object-fit: contain; }
    .elevate { filter: drop-shadow(0 0 12px rgba(255,255,255,0.32)); }
  </style>
</head>
<body>
  <h1>Logo preview</h1>
  <p>Canonical asset: <code>/brands/logo.svg</code></p>
  <div class="grid">
    <section class="panel dark">
      <h2>Dark background</h2>
      <img src="/brands/logo.svg" alt="" class="logo-compact elevate" />
      <img src="/brands/logo.svg" alt="" class="logo-regular elevate" style="margin-top:12px;display:block" />
    </section>
    <section class="panel light">
      <h2>Light background</h2>
      <img src="/brands/logo.svg" alt="" class="logo-compact" />
      <img src="/brands/logo.svg" alt="" class="logo-regular" style="margin-top:12px;display:block" />
    </section>
  </div>
</body>
</html>
